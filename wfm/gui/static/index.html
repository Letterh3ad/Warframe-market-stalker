<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warframe Market Stalker</title>
<style>
:root {
  --bg: #0e1116;
  --bg-raised: #161b22;
  --bg-inset: #0a0d12;
  --border: #262d36;
  --text: #d7dde5;
  --text-dim: #8b949e;
  --text-faint: #5c6773;
  --accent: #4c8dff;
  --up: #3fb950;
  --down: #f85149;
  --warn: #d29922;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 var(--font);
  display: grid; grid-template-columns: 190px 1fr 340px; height: 100vh;
}

#rail {
  background: var(--bg-inset);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  min-width: 0; overflow: auto;
}
.brand {
  padding: 16px 14px 12px;
  font-weight: 600; font-size: 13px; letter-spacing: 0.02em;
  color: var(--text);
  border-bottom: 1px solid var(--border);
}
.brand span { display: block; color: var(--text-faint); font-weight: 400; font-size: 11px; }
.tab-list { display: flex; flex-direction: column; padding: 8px 0; flex: 1; }
.tab-btn {
  appearance: none; border: 0; background: none; cursor: pointer;
  text-align: left; padding: 8px 14px; font: inherit;
  color: var(--text-dim);
  border-left: 2px solid transparent;
}
.tab-btn:hover { color: var(--text); background: var(--bg-raised); }
.tab-btn.active {
  color: var(--text); background: var(--bg-raised);
  border-left-color: var(--accent);
}
.daemon-foot {
  border-top: 1px solid var(--border);
  padding: 10px 14px;
  font-size: 12px; color: var(--text-dim);
  display: flex; align-items: center; gap: 8px;
}
.daemon-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-faint); flex: none;
}
.daemon-dot.up { background: var(--up); }
.daemon-dot.warn { background: var(--warn); }
.daemon-dot.down { background: var(--down); }
.daemon-dot.faint { background: var(--text-faint); }

#list-pane {
  overflow: auto; min-width: 0; padding: 18px 20px 62px;
}
#detail-pane {
  overflow: auto; min-width: 0; padding: 18px 20px 62px;
  background: var(--bg-raised);
  border-left: 1px solid var(--border);
}

h1, h2, h3 { margin: 0 0 12px; font-weight: 600; }
h1 { font-size: 18px; }
h2 { font-size: 15px; }
.muted { color: var(--text-dim); }
.na { color: var(--text-faint); font-style: italic; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
th { color: var(--text-dim); font-weight: 500; }
tbody tr:hover { background: var(--bg-raised); }
tbody tr.row { cursor: pointer; }
tbody tr.row.selected { background: var(--bg-raised); box-shadow: inset 2px 0 0 var(--accent); }
code, .mono { font-family: var(--mono); }
.val-up { color: var(--up); }
.val-down { color: var(--down); }
.ledger-section { margin-bottom: 26px; }
.ledger-section h3 { margin: 16px 0 10px; font-size: 13px; color: var(--text-dim); }
td .btn { padding: 3px 10px; font-size: 12px; }

.catalog-search { margin-bottom: 14px; }
.catalog-search input { width: 280px; max-width: 100%; }
.table-scroll { overflow-x: auto; }
.tag-pill {
  display: inline-block; margin: 0 4px 2px 0; padding: 1px 7px;
  font-size: 11px; border: 1px solid var(--border); border-radius: 999px;
  color: var(--text-dim); background: var(--bg-inset); white-space: nowrap;
}
.set-marker { margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--accent); }
.pager {
  display: flex; align-items: center; gap: 12px;
  margin-top: 14px; font-size: 13px; color: var(--text-dim);
}
.pager button.btn:disabled { opacity: 0.4; cursor: default; border-color: var(--border); }

button.btn {
  appearance: none; cursor: pointer; font: inherit;
  background: var(--bg-inset); color: var(--text);
  border: 1px solid var(--border); border-radius: 5px;
  padding: 5px 12px;
}
button.btn:hover { border-color: var(--accent); color: var(--text); }
button.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--bg); }
button.btn:disabled { opacity: 0.5; cursor: default; border-color: var(--border); color: var(--text-dim); }

/* --- detail pane (Task 7) --- */
.detail-header { margin-bottom: 16px; }
.detail-header .slug-line { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
.detail-header .tags { margin-bottom: 8px; }
.watch-state { font-size: 12px; color: var(--text-faint); }
.watch-state.on { color: var(--up); }
.detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 20px; }
.stat-block { margin-bottom: 20px; }
.stat-block h2 { margin-bottom: 8px; }
table.stat-table { table-layout: fixed; }
table.stat-table th { width: 46%; font-weight: 500; color: var(--text-dim); vertical-align: top; }
table.stat-table td { font-family: var(--mono); }
.missing-line {
  font-size: 12px; color: var(--warn);
  padding: 8px 10px; border: 1px solid var(--border);
  border-radius: 5px; background: var(--bg-inset);
}
.age-line { margin-top: 8px; font-size: 12px; color: var(--text-dim); }
.kv { display: flex; gap: 8px; padding: 6px 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
.kv .k { width: 46%; color: var(--text-dim); }
.kv .v { font-family: var(--mono); }

/* --- price history chart (Task 8) --- */
.price-chart {
  width: 100%; max-width: 100%; height: 260px;
  border: 1px solid var(--border); border-radius: 5px;
  background: var(--bg-inset); overflow: hidden;
}
.price-chart .chart-note {
  margin: 0; padding: 12px; font-size: 12px; color: var(--text-dim);
}

input, select {
  font: inherit; background: var(--bg-inset); color: var(--text);
  border: 1px solid var(--border); border-radius: 5px; padding: 5px 8px;
}

#error-banner {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: var(--down); color: var(--bg);
  padding: 10px 16px; font-size: 13px;
  display: flex; align-items: center; gap: 12px;
  z-index: 50;
}
#error-banner .msg { flex: 1; }
#error-banner button {
  appearance: none; border: 1px solid var(--bg); background: none;
  color: var(--bg); cursor: pointer; border-radius: 4px;
  padding: 2px 8px; font: inherit;
}
</style>
<script src="/static/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <nav id="rail">
    <div class="brand">Warframe Market Stalker<span>phase 8 dashboard</span></div>
    <div class="tab-list" id="tab-list"></div>
    <div class="daemon-foot" id="daemon-foot">
      <span class="daemon-dot faint" id="daemon-dot"></span>
      <span id="daemon-label">checking...</span>
    </div>
  </nav>
  <main id="list-pane"></main>
  <aside id="detail-pane"></aside>
  <div id="error-banner" hidden>
    <span class="msg" id="error-msg"></span>
    <button type="button" onclick="clearError()">dismiss</button>
  </div>
<script>
"use strict";

// --- shared UI state -----------------------------------------------------
// state.catalog is read by the Catalog tab (below) and the detail pane (Task 7).
const state = {
  catalog: { q: "", offset: 0, limit: 100, total: 0 },
};

// --- fetch helper -----------------------------------------------------------
// Returns parsed JSON (null for 204). Throws Error on non-2xx, using the
// backend's {"error": "..."} message when present, else "<status> <statusText>".
async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) {
    let message = `${response.status} ${response.statusText}`;
    try { const body = await response.json(); if (body.error) message = body.error; }
    catch (_) { /* non-JSON error body; keep the status line */ }
    throw new Error(message);
  }
  return response.status === 204 ? null : response.json();
}

// --- error banner ---------------------------------------------------------
function showError(message) {
  document.getElementById("error-msg").textContent = message;
  document.getElementById("error-banner").hidden = false;
}
function clearError() {
  document.getElementById("error-banner").hidden = true;
  document.getElementById("error-msg").textContent = "";
}

// --- DOM builder --------------------------------------------------------------
// el(tag, attrs, ...children). attrs: class/className -> class attr, dataset ->
// data-* attrs, on* -> event listeners, anything else -> setAttribute.
// Children: strings become text nodes, nodes appended as-is, nullish skipped.
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [key, value] of Object.entries(attrs)) {
      if (value == null) continue;
      if (key === "class" || key === "className") {
        node.className = value;
      } else if (key === "dataset") {
        for (const [dk, dv] of Object.entries(value)) node.dataset[dk] = dv;
      } else if (key.startsWith("on") && typeof value === "function") {
        node.addEventListener(key.slice(2).toLowerCase(), value);
      } else {
        node.setAttribute(key, value);
      }
    }
  }
  for (const child of children) {
    if (child == null) continue;
    node.append(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return node;
}

// --- null-honest formatter -------------------------------------------------
// CONTRACT: fmt ALWAYS returns a STRING (never an Element).
//   null / undefined      -> '<span class="na">unavailable</span>'  (HTML string)
//   non-number (any type)  -> '<span class="na">unavailable</span>'  (HTML string)
//   number                 -> String(value) + (unit || "")          ('0' for 0)
// Output is HTML for innerHTML / template-literal use ONLY, never textContent:
// the unavailable branches return a literal <span> tag. The non-number guard
// keeps a later task's stray server string from becoming an injection vector.
// 0 is a real value and renders as '0' (typeof 0 === "number").
function fmt(value, unit) {
  if (value == null) return '<span class="na">unavailable</span>';
  if (typeof value !== "number") return '<span class="na">unavailable</span>';
  return `${value}${unit || ""}`;
}

// --- tab registry ----------------------------------------------------------
function stubRender(label) {
  document.getElementById("list-pane").append(
    el("p", { class: "muted" }, `${label} - not built yet.`)
  );
}

// --- item detail pane (Task 7) -----------------------------------------------
// selectItem(slug, rank, meta): meta is the catalog/watchlist row that triggered
// the click. It carries `tags` and `is_set`, which GET /items/{slug} does NOT
// return, so the header needs it. meta is optional; without it tags are dropped
// and `is_set` falls back to a `_set` slug suffix.

function detailEmpty() {
  document.getElementById("detail-pane").replaceChildren(
    el("p", { class: "muted" }, "select an item")
  );
}

// Human staleness for book_age_seconds. null -> "never fetched".
function humanAge(seconds) {
  if (seconds == null) return "never fetched";
  if (seconds < 45) return "just now";
  const mins = Math.round(seconds / 60);
  if (mins < 60) return `${mins} ${mins === 1 ? "minute" : "minutes"} old`;
  const hours = Math.round(seconds / 3600);
  if (hours < 48) return `${hours} ${hours === 1 ? "hour" : "hours"} old`;
  const days = Math.round(seconds / 86400);
  return `${days} ${days === 1 ? "day" : "days"} old`;
}

// One line per entirely-absent block (from provenance.missing), naming it and the
// relevant sample counts from provenance.samples. NOT a grid of unavailable rows.
const MISSING_BLOCK_LINE = {
  price: (s) => `price history unavailable (${s.price_90d || 0} candles in 90d, ${s.price_7d || 0} in 7d)`,
  book: () => "order book unavailable (no snapshot fetched)",
  seasonality: (s) => `seasonality unavailable (${s.seasonality_bucket || 0} bucket / ${s.seasonality_total || 0} total observations)`,
  market: (s) => `market cohort unavailable (${s.market_cohort || 0} cohort members)`,
};

function missingLine(name, samples) {
  const build = MISSING_BLOCK_LINE[name];
  return el("div", { class: "missing-line" }, build ? build(samples) : `${name} unavailable`);
}

// Bridge fmt()'s HTML-STRING return into the DOM: build a <tbody> via innerHTML
// from [label, fmtOutput] pairs. SAFE because every label here is a hard-coded
// literal and every value is fmt() output (numbers/null only) - no server string
// ever reaches this innerHTML. Server strings (name, slug, tags, market.tag) go
// through el() text nodes instead.
function statTable(pairs) {
  const tbody = el("tbody");
  tbody.innerHTML = pairs
    .map(([label, html]) => `<tr><th>${label}</th><td>${html}</td></tr>`)
    .join("");
  return el("table", { class: "stat-table" }, tbody);
}

// --- price history chart (Task 8) ------------------------------------------
// The history fetch is fired alongside GET /items/{slug} (not after it) and its
// result cached in historyState keyed by detailSeq. Whichever of the two
// resolves last triggers the draw: renderDetail calls drawPriceChart() once the
// #price-chart container exists, and the history promise calls it again when the
// rows arrive. Stale responses (seq !== detailSeq) are dropped.
let priceChart = null;
let detailSeq = 0;
const historyState = { seq: -1, status: "pending", rows: null };

function disposePriceChart() {
  if (priceChart) {
    try { priceChart.remove(); } catch (_) { /* container already gone */ }
    priceChart = null;
  }
}

// Draws (or redraws) into #price-chart from historyState. No-op when the
// container is absent (detail pane not rendered yet). Always disposes the prior
// chart first so click-through does not leak an instance per selection.
function drawPriceChart() {
  const box = document.getElementById("price-chart");
  if (!box) return;
  disposePriceChart();
  box.replaceChildren();

  if (historyState.status === "pending") {
    box.append(el("p", { class: "chart-note" }, "loading chart…"));
    return;
  }
  if (historyState.status === "error") {
    box.append(el("p", { class: "chart-note" }, "chart unavailable"));
    return;
  }

  const rows = (historyState.rows || []).filter(
    (r) => r && r.open != null && r.high != null && r.low != null && r.close != null
  );
  if (rows.length < 2) {
    box.append(el("p", { class: "chart-note" },
      rows.length === 0
        ? "no history to chart"
        : `not enough history to chart (${rows.length} candle${rows.length === 1 ? "" : "s"})`));
    return;
  }
  if (!window.LightweightCharts) {
    box.append(el("p", { class: "chart-note" }, "chart unavailable"));
    return;
  }

  const css = getComputedStyle(document.documentElement);
  const c = (name) => css.getPropertyValue(name).trim();
  const chart = window.LightweightCharts.createChart(box, {
    width: box.clientWidth,
    height: 260,
    layout: { background: { color: c("--bg-inset") }, textColor: c("--text-dim") },
    grid: {
      vertLines: { color: c("--border") },
      horzLines: { color: c("--border") },
    },
    timeScale: { borderColor: c("--border") },
    rightPriceScale: { borderColor: c("--border") },
  });
  const series = chart.addCandlestickSeries({
    upColor: c("--up"), downColor: c("--down"),
    wickUpColor: c("--up"), wickDownColor: c("--down"),
    borderVisible: false,
  });
  series.setData(rows.map((r) => ({
    time: r.date, open: r.open, high: r.high, low: r.low, close: r.close,
  })));
  chart.timeScale().fitContent();
  priceChart = chart;
}

async function selectItem(slug, rank, meta) {
  const seq = ++detailSeq;
  disposePriceChart();
  historyState.seq = seq;
  historyState.status = "pending";
  historyState.rows = null;

  const pane = document.getElementById("detail-pane");
  pane.replaceChildren(el("p", { class: "muted" }, "loading..."));
  const ref = { slug, rank, meta: meta || {} };

  // Fire both requests now; render each as it resolves so a slow one does not
  // block the other.
  const itemP = api(`/items/${encodeURIComponent(slug)}?rank=${encodeURIComponent(rank)}`);
  const historyP = api(
    `/items/${encodeURIComponent(slug)}/history?rank=${encodeURIComponent(rank)}&days=90`
  );

  historyP.then(
    (rows) => {
      if (seq !== detailSeq) return;
      historyState.status = "ok";
      historyState.rows = Array.isArray(rows) ? rows : [];
      drawPriceChart();
    },
    (e) => {
      if (seq !== detailSeq) return;
      historyState.status = "error";
      historyState.rows = null;
      showError(e.message);
      drawPriceChart();
    },
  );

  let body;
  try {
    body = await itemP;
  } catch (e) {
    if (seq !== detailSeq) return;
    disposePriceChart();
    pane.replaceChildren(el("p", { class: "muted" }, "could not load item."));
    showError(e.message);
    return;
  }
  if (seq !== detailSeq) return;
  renderDetail(body, ref);
}

function renderDetail(body, ref) {
  const pane = document.getElementById("detail-pane");
  // Refresh / watchlist re-renders replace the whole pane; drop the old chart
  // before its container node is discarded, then redraw from cached history.
  disposePriceChart();
  const price = body.price || {};
  const market = body.market || {};
  const book = body.book || {};
  const season = body.seasonality || {};
  const prov = body.provenance || { available: [], missing: [], samples: {} };
  const available = prov.available || [];
  const missing = prov.missing || [];
  const samples = prov.samples || {};

  const tags = ref.meta.tags || [];
  const isSet = ref.meta.is_set != null ? ref.meta.is_set : /_set$/.test(body.slug || "");

  const header = el("div", { class: "detail-header" },
    el("h1", null,
      body.name || body.slug,
      isSet ? el("span", { class: "set-marker" }, "set") : null,
    ),
    el("div", { class: "slug-line mono" }, `${body.slug}  ·  rank ${body.rank}`),
    tags.length
      ? el("div", { class: "tags" }, ...tags.map((t) => el("span", { class: "tag-pill" }, t)))
      : null,
    el("div", { class: body.watched ? "watch-state on" : "watch-state" },
      body.watched ? "on watchlist" : "not watched"),
  );

  // --- Refresh button: the ONLY control that contacts warframe.market ---
  const refreshBtn = el("button", { class: "btn", type: "button" }, "Refresh live book (API call)");
  refreshBtn.addEventListener("click", async () => {
    const original = refreshBtn.textContent;
    refreshBtn.disabled = true;
    refreshBtn.textContent = "contacting warframe.market…";
    try {
      const fresh = await api(
        `/items/${encodeURIComponent(ref.slug)}?rank=${encodeURIComponent(ref.rank)}&refresh=true`
      );
      renderDetail(fresh, ref);
    } catch (e) {
      showError(e.message);
      refreshBtn.disabled = false;
      refreshBtn.textContent = original;
    }
  });

  // --- Watchlist toggle: re-fetches after so `watched` is authoritative ---
  const watchBtn = el("button", { class: "btn", type: "button" },
    body.watched ? "− Remove from watchlist" : "+ Add to watchlist");
  watchBtn.addEventListener("click", async () => {
    watchBtn.disabled = true;
    try {
      if (body.watched) {
        await api(
          `/watchlist/${encodeURIComponent(ref.slug)}/${encodeURIComponent(ref.rank)}`,
          { method: "DELETE" }
        );
      } else {
        await api("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query: ref.slug, rank: ref.rank }),
        });
      }
      const fresh = await api(
        `/items/${encodeURIComponent(ref.slug)}?rank=${encodeURIComponent(ref.rank)}`
      );
      renderDetail(fresh, ref);
    } catch (e) {
      showError(e.message);
      watchBtn.disabled = false;
    }
  });

  const actions = el("div", { class: "detail-actions" }, refreshBtn, watchBtn);

  // --- Price history chart (filled by drawPriceChart once history resolves) ---
  const chartBlock = el("div", { class: "stat-block" },
    el("h2", null, "Price history"),
    el("div", { id: "price-chart", class: "price-chart" }),
  );

  // --- Statistics (price) ---
  const statsBlock = el("div", { class: "stat-block" }, el("h2", null, "Statistics"));
  if (available.includes("price")) {
    statsBlock.append(statTable([
      ["last close", fmt(price.last_close, "p")],
      ["median 7d", fmt(price.median_7d, "p")],
      ["median 30d", fmt(price.median_30d, "p")],
      ["median 90d", fmt(price.median_90d, "p")],
      ["robust z", fmt(price.robust_z)],
      ["percentile 90d", fmt(price.percentile_90d)],
      ["ATR 14d", fmt(price.atr_14d)],
      ["ATR %", fmt(price.atr_pct)],
      ["volume trend", fmt(price.volume_trend)],
      ["median volume 30d", fmt(price.median_volume_30d)],
      ["donchian position", fmt(price.donchian_position)],
    ]));
  } else {
    statsBlock.append(missingLine("price", samples));
  }

  // --- Market ---
  const marketBlock = el("div", { class: "stat-block" }, el("h2", null, "Market"));
  if (available.includes("market")) {
    marketBlock.append(statTable([
      ["excess return 7d", fmt(market.excess_return_7d)],
      ["cohort size", fmt(market.cohort_size)],
    ]));
    // market.tag is a server STRING; fmt would call it "unavailable". Render it as
    // an escaped text node, with a null guard of its own.
    marketBlock.append(
      el("div", { class: "kv" },
        el("span", { class: "k" }, "tag"),
        market.tag == null
          ? el("span", { class: "v na" }, "unavailable")
          : el("span", { class: "v" }, market.tag),
      )
    );
  } else {
    marketBlock.append(missingLine("market", samples));
  }

  // --- Seasonality (rows when the block is present, else one missing line) ---
  const seasonBlock = el("div", { class: "stat-block" }, el("h2", null, "Seasonality"));
  if (available.includes("seasonality")) {
    seasonBlock.append(statTable([
      ["bucket", fmt(season.bucket)],
      ["observed bucket", fmt(season.observed_bucket)],
      ["observed age (h)", fmt(season.observed_age_hours)],
      ["expected price", fmt(season.expected_price)],
      ["expected volume", fmt(season.expected_volume)],
      ["price deviation", fmt(season.price_deviation)],
      ["volume deviation", fmt(season.volume_deviation)],
      ["confidence", fmt(season.confidence)],
      ["best bucket next 48h", fmt(season.best_bucket_next_48h)],
    ]));
  } else {
    seasonBlock.append(missingLine("seasonality", samples));
  }

  // --- Book ---
  const bookBlock = el("div", { class: "stat-block" }, el("h2", null, "Order book"));
  if (available.includes("book")) {
    bookBlock.append(statTable([
      ["online best bid", fmt(book.online_best_bid, "p")],
      ["online best ask", fmt(book.online_best_ask, "p")],
      ["online spread", fmt(book.online_spread, "p")],
      ["online spread %", fmt(book.online_spread_pct)],
      ["stale share", fmt(book.stale_share)],
      ["online bid count", fmt(book.online_bid_count)],
      ["online ask count", fmt(book.online_ask_count)],
    ]));
  } else {
    bookBlock.append(missingLine("book", samples));
  }
  bookBlock.append(
    el("div", { class: "age-line" }, `book age: ${humanAge(body.book_age_seconds)}`)
  );

  pane.replaceChildren(header, actions, chartBlock, statsBlock, marketBlock, seasonBlock, bookBlock);
  drawPriceChart();
}

let catalogDebounce = null;
let catalogReqSeq = 0;

function renderCatalog() {
  const pane = document.getElementById("list-pane");
  const input = el("input", {
    type: "search",
    placeholder: "search catalog by name...",
    value: state.catalog.q,
    oninput: (e) => {
      const q = e.target.value;
      clearTimeout(catalogDebounce);
      catalogDebounce = setTimeout(() => {
        state.catalog.q = q;
        state.catalog.offset = 0;
        loadCatalog();
      }, 250);
    },
  });
  pane.append(
    el("h1", null, "Catalog"),
    el("div", { class: "catalog-search" }, input),
    el("div", { id: "catalog-body" }),
  );
  detailEmpty();
  loadCatalog();
}

async function loadCatalog() {
  const body = document.getElementById("catalog-body");
  if (!body) return;
  const seq = ++catalogReqSeq;
  body.replaceChildren(el("p", { class: "muted" }, "loading..."));

  const { q, offset, limit } = state.catalog;
  const params = new URLSearchParams({ limit: String(limit), offset: String(offset) });
  if (q) params.set("q", q);

  let data;
  try {
    data = await api(`/catalog?${params}`);
  } catch (e) {
    if (seq !== catalogReqSeq) return;
    body.replaceChildren(el("p", { class: "muted" }, "could not load catalog."));
    showError(e.message);
    return;
  }
  if (seq !== catalogReqSeq) return;
  // No unconditional clearError() here: the detail pane (Task 7) raises errors
  // from Refresh / watchlist actions, and a background catalog refetch or a
  // tab-switch back to Catalog must not silently wipe one the user hasn't seen.
  // The banner clears only on dismiss or when a new showError replaces it.
  state.catalog.total = data.total || 0;
  paintCatalog(body, data.items || []);
}

function paintCatalog(body, items) {
  if (items.length === 0) {
    body.replaceChildren(el("p", { class: "muted" }, "no items match"), buildPager());
    return;
  }
  const rows = items.map((it) => {
    const tr = el("tr", {
      class: "row",
      dataset: { slug: it.slug },
      onclick: () => {
        for (const s of body.querySelectorAll("tr.row.selected")) s.classList.remove("selected");
        tr.classList.add("selected");
        selectItem(it.slug, it.canonical_rank, it);
      },
    },
      el("td", null,
        it.name,
        it.is_set ? el("span", { class: "set-marker" }, "set") : null,
      ),
      el("td", null, ...(it.tags || []).map((t) => el("span", { class: "tag-pill" }, t))),
      el("td", { class: "mono" }, String(it.canonical_rank)),
    );
    return tr;
  });
  const table = el("table", null,
    el("thead", null, el("tr", null,
      el("th", null, "Name"), el("th", null, "Tags"), el("th", null, "Rank"))),
    el("tbody", null, ...rows),
  );
  body.replaceChildren(el("div", { class: "table-scroll" }, table), buildPager());
}

function buildPager() {
  const { offset, limit, total } = state.catalog;
  const first = total === 0 ? 0 : Math.min(offset + 1, total);
  const last = Math.min(offset + limit, total);
  const prev = el("button", {
    class: "btn", type: "button",
    onclick: () => { state.catalog.offset = Math.max(0, offset - limit); loadCatalog(); },
  }, "‹ prev");
  prev.disabled = offset === 0;
  const next = el("button", {
    class: "btn", type: "button",
    onclick: () => { state.catalog.offset = offset + limit; loadCatalog(); },
  }, "next ›");
  next.disabled = offset + limit >= total;
  return el("div", { class: "pager" },
    prev,
    el("span", null, `showing ${first}–${last} of ${total}`),
    next,
  );
}

// --- fmt() -> DOM bridges (Task 9) ----------------------------------------
// fmt() returns an HTML STRING (numbers / null / non-number only -> never a
// server string). These helpers drop that string into a fresh node via
// innerHTML; SAFE for the same reason statTable's innerHTML is - no server
// string ever reaches it. Server strings (name, slug) use el() text nodes.
function signClass(value) {
  if (typeof value !== "number" || value === 0) return null;
  return value > 0 ? "val-up" : "val-down";
}
function numTd(value, unit, colorClass) {
  const td = el("td", { class: colorClass ? `mono ${colorClass}` : "mono" });
  td.innerHTML = fmt(value, unit);
  return td;
}
function statLine(label, value, unit) {
  const v = el("span", { class: "v" });
  const cls = signClass(value);
  if (cls) v.classList.add(cls);
  v.innerHTML = fmt(value, unit);
  return el("div", { class: "kv" }, el("span", { class: "k" }, label), v);
}

// --- Watchlist tab -------------------------------------------------------
function renderWatchlist() {
  document.getElementById("list-pane").append(
    el("h1", null, "Watchlist"),
    el("div", { id: "watchlist-body" }),
  );
  detailEmpty();
  loadWatchlist();
}

async function loadWatchlist() {
  const body = document.getElementById("watchlist-body");
  if (!body) return;
  body.replaceChildren(el("p", { class: "muted" }, "loading..."));
  let rows;
  try {
    rows = await api("/watchlist");
  } catch (e) {
    body.replaceChildren(el("p", { class: "muted" }, "could not load watchlist."));
    showError(e.message);
    return;
  }
  paintWatchlist(body, rows || []);
}

function paintWatchlist(body, rows) {
  if (rows.length === 0) {
    body.replaceChildren(
      el("p", { class: "muted" }, "nothing watched yet. add items from the Catalog tab."),
    );
    return;
  }
  const trs = rows.map((row) => {
    const removeBtn = el("button", {
      class: "btn", type: "button",
      onclick: async (e) => {
        e.stopPropagation();
        removeBtn.disabled = true;
        try {
          await api(
            `/watchlist/${encodeURIComponent(row.slug)}/${encodeURIComponent(row.rank)}`,
            { method: "DELETE" },
          );
          loadWatchlist();
        } catch (err) {
          showError(err.message);
          removeBtn.disabled = false;
        }
      },
    }, "remove");
    const tr = el("tr", {
      class: "row",
      dataset: { slug: row.slug },
      onclick: () => {
        for (const s of body.querySelectorAll("tr.row.selected")) s.classList.remove("selected");
        tr.classList.add("selected");
        selectItem(row.slug, row.rank, row);
      },
    },
      el("td", null, row.name || row.slug),
      el("td", { class: "mono" }, String(row.rank)),
      el("td", { class: "mono" }, String(row.pin_weight)),
      el("td", null, row.alert_override ? "yes" : "no"),
      el("td", { class: "mono" }, (row.added_at || "").slice(0, 10)),
      el("td", null, removeBtn),
    );
    return tr;
  });
  const table = el("table", null,
    el("thead", null, el("tr", null,
      el("th", null, "Name"), el("th", null, "Rank"), el("th", null, "Pin"),
      el("th", null, "Alert"), el("th", null, "Added"), el("th", null, ""))),
    el("tbody", null, ...trs),
  );
  body.replaceChildren(el("div", { class: "table-scroll" }, table));
}

// --- Ledger tab (read-only; the GUI records no trades) ------------------
function renderLedger() {
  document.getElementById("list-pane").append(
    el("h1", null, "Ledger"),
    el("div", { id: "ledger-holdings", class: "ledger-section" }),
    el("div", { id: "ledger-pnl", class: "ledger-section" }),
  );
  detailEmpty();
  loadLedger();
}

async function loadLedger() {
  const hBox = document.getElementById("ledger-holdings");
  const pBox = document.getElementById("ledger-pnl");
  if (!hBox || !pBox) return;
  hBox.replaceChildren(el("h2", null, "Holdings"), el("p", { class: "muted" }, "loading..."));
  pBox.replaceChildren(el("h2", null, "P&L"), el("p", { class: "muted" }, "loading..."));

  let holdings, pnl;
  try {
    [holdings, pnl] = await Promise.all([api("/ledger/holdings"), api("/ledger/pnl")]);
  } catch (e) {
    hBox.replaceChildren(el("h2", null, "Holdings"),
      el("p", { class: "muted" }, "could not load ledger."));
    pBox.replaceChildren();
    showError(e.message);
    return;
  }
  const nameMap = {};
  for (const r of holdings || []) nameMap[r.slug] = r.name || r.slug;
  for (const r of (pnl && pnl.open_positions) || []) nameMap[r.slug] = r.name || r.slug;

  paintHoldings(hBox, holdings || []);
  paintPnl(pBox, pnl || {}, nameMap);
}

function paintHoldings(box, rows) {
  box.replaceChildren(el("h2", null, "Holdings"));
  if (rows.length === 0) {
    box.append(el("p", { class: "muted" }, "no holdings"));
    return;
  }
  const trs = rows.map((r) => el("tr", null,
    el("td", null, r.name || r.slug),
    el("td", { class: "mono" }, String(r.rank)),
    el("td", { class: "mono" }, String(r.quantity)),
    numTd(r.avg_cost, "p"),
    numTd(r.mark, "p"),
    numTd(r.unrealized_profit, "p", signClass(r.unrealized_profit)),
  ));
  const table = el("table", null,
    el("thead", null, el("tr", null,
      el("th", null, "Name"), el("th", null, "Rank"), el("th", null, "Qty"),
      el("th", null, "Cost basis"), el("th", null, "Mark"), el("th", null, "Unrealized"))),
    el("tbody", null, ...trs),
  );
  box.append(el("div", { class: "table-scroll" }, table));
}

function paintPnl(box, pnl, nameMap) {
  box.replaceChildren(
    el("h2", null, "P&L"),
    statLine("realized profit", pnl.realized_profit, "p"),
    statLine("trades", pnl.trades),
    el("h3", null, "Closed trades"),
  );
  const lots = pnl.lots || [];
  if (lots.length === 0) {
    box.append(el("p", { class: "muted" }, "no closed trades yet"));
    return;
  }
  const trs = lots.map((l) => el("tr", null,
    el("td", null, (nameMap && nameMap[l.slug]) || l.slug),
    el("td", { class: "mono" }, String(l.rank)),
    el("td", { class: "mono" }, String(l.quantity)),
    numTd(l.cost, "p"),
    numTd(l.proceeds, "p"),
    numTd(l.profit, "p", signClass(l.profit)),
  ));
  const table = el("table", null,
    el("thead", null, el("tr", null,
      el("th", null, "Name"), el("th", null, "Rank"), el("th", null, "Qty"),
      el("th", null, "Cost"), el("th", null, "Proceeds"), el("th", null, "Profit"))),
    el("tbody", null, ...trs),
  );
  box.append(el("div", { class: "table-scroll" }, table));
}

const TABS = [
  { id: "catalog",   label: "Catalog",   render() { renderCatalog(); } },
  { id: "watchlist", label: "Watchlist", render() { renderWatchlist(); } },
  { id: "signals",   label: "Signals",   render() { stubRender("Signals"); } },
  { id: "groups",    label: "Groups",    render() { stubRender("Groups"); } },
  { id: "daemon",    label: "Daemon",    render() { stubRender("Daemon"); } },
  { id: "ledger",    label: "Ledger",    render() { renderLedger(); } },
];

let activeTab = null;

function selectTab(id) {
  const tab = TABS.find((t) => t.id === id);
  if (!tab) return;
  activeTab = id;
  for (const btn of document.querySelectorAll(".tab-btn")) {
    btn.classList.toggle("active", btn.dataset.tab === id);
  }
  disposePriceChart();
  document.getElementById("list-pane").replaceChildren();
  document.getElementById("detail-pane").replaceChildren();
  tab.render();
}

function buildRail() {
  const list = document.getElementById("tab-list");
  for (const tab of TABS) {
    list.append(
      el("button", {
        class: "tab-btn", type: "button",
        dataset: { tab: tab.id },
        onclick: () => selectTab(tab.id),
      }, tab.label)
    );
  }
}

// --- daemon status poll --------------------------------------------------
function setDaemon(dotClass, label) {
  document.getElementById("daemon-dot").className = `daemon-dot ${dotClass}`;
  document.getElementById("daemon-label").textContent = label;
}

async function pollDaemon() {
  try {
    const s = await api("/daemon/status");
    if (s.status === "running") {
      if (s.stale) setDaemon("warn", "stale");
      else setDaemon("up", "running");
    } else if (s.status === "halted" || s.status === "stopping") {
      setDaemon("down", s.status);
    } else if (s.stale) {
      setDaemon("warn", "stale");
    } else if (s.status === "not running") {
      setDaemon("faint", "not running");
    } else {
      setDaemon("faint", s.status || "unknown");
    }
  } catch (_) {
    // A down daemon is a normal state, not a dismissible error.
    setDaemon("down", "unreachable");
  }
}

// --- boot ----------------------------------------------------------------
document.addEventListener("DOMContentLoaded", () => {
  buildRail();
  selectTab("catalog");
  pollDaemon();
  setInterval(pollDaemon, 10000);
  window.addEventListener("resize", () => {
    const box = document.getElementById("price-chart");
    if (priceChart && box) priceChart.applyOptions({ width: box.clientWidth });
  });
});
</script>
