<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warframe Market Stalker</title>
<style>
:root {
  --bg: #0e1116;
  --bg-raised: #161b22;
  --bg-inset: #0a0d12;
  --border: #262d36;
  --text: #d7dde5;
  --text-dim: #8b949e;
  --text-faint: #5c6773;
  --accent: #4c8dff;
  --up: #3fb950;
  --down: #f85149;
  --warn: #d29922;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { overflow-x: hidden; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 var(--font);
  display: grid; grid-template-columns: 190px 1fr 340px; height: 100vh;
}

#rail {
  background: var(--bg-inset);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  min-width: 0; overflow: auto;
}
.brand {
  padding: 16px 14px 12px;
  font-weight: 600; font-size: 13px; letter-spacing: 0.02em;
  color: var(--text);
  border-bottom: 1px solid var(--border);
}
.brand span { display: block; color: var(--text-faint); font-weight: 400; font-size: 11px; }
.tab-list { display: flex; flex-direction: column; padding: 8px 0; flex: 1; }
.tab-btn {
  appearance: none; border: 0; background: none; cursor: pointer;
  text-align: left; padding: 8px 14px; font: inherit;
  color: var(--text-dim);
  border-left: 2px solid transparent;
}
.tab-btn:hover { color: var(--text); background: var(--bg-raised); }
.tab-btn.active {
  color: var(--text); background: var(--bg-raised);
  border-left-color: var(--accent);
}
.daemon-foot {
  border-top: 1px solid var(--border);
  padding: 10px 14px;
  font-size: 12px; color: var(--text-dim);
  display: flex; align-items: center; gap: 8px;
}
.daemon-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--text-faint); flex: none;
}
.daemon-dot.up { background: var(--up); }
.daemon-dot.warn { background: var(--warn); }
.daemon-dot.down { background: var(--down); }
.daemon-dot.faint { background: var(--text-faint); }

#list-pane {
  overflow: auto; min-width: 0; padding: 18px 20px 62px;
}
#detail-pane {
  overflow: auto; min-width: 0; padding: 18px 20px 62px;
  background: var(--bg-raised);
  border-left: 1px solid var(--border);
}

h1, h2, h3 { margin: 0 0 12px; font-weight: 600; }
h1 { font-size: 18px; }
h2 { font-size: 15px; }
.muted { color: var(--text-dim); }
.na { color: var(--text-faint); font-style: italic; }

table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
th { color: var(--text-dim); font-weight: 500; }
tbody tr:hover { background: var(--bg-raised); }
code, .mono { font-family: var(--mono); }

button.btn {
  appearance: none; cursor: pointer; font: inherit;
  background: var(--bg-inset); color: var(--text);
  border: 1px solid var(--border); border-radius: 5px;
  padding: 5px 12px;
}
button.btn:hover { border-color: var(--accent); color: var(--text); }
button.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--bg); }

input, select {
  font: inherit; background: var(--bg-inset); color: var(--text);
  border: 1px solid var(--border); border-radius: 5px; padding: 5px 8px;
}

#error-banner {
  position: fixed; left: 0; right: 0; bottom: 0;
  background: var(--down); color: var(--bg);
  padding: 10px 16px; font-size: 13px;
  display: flex; align-items: center; gap: 12px;
  z-index: 50;
}
#error-banner .msg { flex: 1; }
#error-banner button {
  appearance: none; border: 1px solid var(--bg); background: none;
  color: var(--bg); cursor: pointer; border-radius: 4px;
  padding: 2px 8px; font: inherit;
}
</style>
</head>
<body>
  <nav id="rail">
    <div class="brand">Warframe Market Stalker<span>phase 8 dashboard</span></div>
    <div class="tab-list" id="tab-list"></div>
    <div class="daemon-foot" id="daemon-foot">
      <span class="daemon-dot faint" id="daemon-dot"></span>
      <span id="daemon-label">checking...</span>
    </div>
  </nav>
  <main id="list-pane"></main>
  <aside id="detail-pane"></aside>
  <div id="error-banner" hidden>
    <span class="msg" id="error-msg"></span>
    <button type="button" onclick="clearError()">dismiss</button>
  </div>
<script>
"use strict";

// --- fetch helper -----------------------------------------------------------
// Returns parsed JSON (null for 204). Throws Error on non-2xx, using the
// backend's {"error": "..."} message when present, else "<status> <statusText>".
async function api(path, options) {
  const response = await fetch(path, options);
  if (!response.ok) {
    let message = `${response.status} ${response.statusText}`;
    try { const body = await response.json(); if (body.error) message = body.error; }
    catch (_) { /* non-JSON error body; keep the status line */ }
    throw new Error(message);
  }
  return response.status === 204 ? null : response.json();
}

// --- error banner ---------------------------------------------------------
function showError(message) {
  document.getElementById("error-msg").textContent = message;
  document.getElementById("error-banner").hidden = false;
}
function clearError() {
  document.getElementById("error-banner").hidden = true;
  document.getElementById("error-msg").textContent = "";
}

// --- DOM builder --------------------------------------------------------------
// el(tag, attrs, ...children). attrs: class/className -> class attr, dataset ->
// data-* attrs, on* -> event listeners, anything else -> setAttribute.
// Children: strings become text nodes, nodes appended as-is, nullish skipped.
function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [key, value] of Object.entries(attrs)) {
      if (value == null) continue;
      if (key === "class" || key === "className") {
        node.className = value;
      } else if (key === "dataset") {
        for (const [dk, dv] of Object.entries(value)) node.dataset[dk] = dv;
      } else if (key.startsWith("on") && typeof value === "function") {
        node.addEventListener(key.slice(2).toLowerCase(), value);
      } else {
        node.setAttribute(key, value);
      }
    }
  }
  for (const child of children) {
    if (child == null) continue;
    node.append(typeof child === "string" ? document.createTextNode(child) : child);
  }
  return node;
}

// --- null-honest formatter -------------------------------------------------
// CONTRACT: fmt ALWAYS returns a STRING (never an Element).
//   null / undefined      -> '<span class="na">unavailable</span>'  (HTML string)
//   non-number (any type)  -> '<span class="na">unavailable</span>'  (HTML string)
//   number                 -> String(value) + (unit || "")          ('0' for 0)
// Output is HTML for innerHTML / template-literal use ONLY, never textContent:
// the unavailable branches return a literal <span> tag. The non-number guard
// keeps a later task's stray server string from becoming an injection vector.
// 0 is a real value and renders as '0' (typeof 0 === "number").
function fmt(value, unit) {
  if (value == null) return '<span class="na">unavailable</span>';
  if (typeof value !== "number") return '<span class="na">unavailable</span>';
  return `${value}${unit || ""}`;
}

// --- tab registry ----------------------------------------------------------
function stubRender(label) {
  document.getElementById("list-pane").append(
    el("p", { class: "muted" }, `${label} - not built yet.`)
  );
}

const TABS = [
  { id: "catalog",   label: "Catalog",   render() { stubRender("Catalog"); } },
  { id: "watchlist", label: "Watchlist", render() { stubRender("Watchlist"); } },
  { id: "signals",   label: "Signals",   render() { stubRender("Signals"); } },
  { id: "groups",    label: "Groups",    render() { stubRender("Groups"); } },
  { id: "daemon",    label: "Daemon",    render() { stubRender("Daemon"); } },
  { id: "ledger",    label: "Ledger",    render() { stubRender("Ledger"); } },
];

let activeTab = null;

function selectTab(id) {
  const tab = TABS.find((t) => t.id === id);
  if (!tab) return;
  activeTab = id;
  for (const btn of document.querySelectorAll(".tab-btn")) {
    btn.classList.toggle("active", btn.dataset.tab === id);
  }
  document.getElementById("list-pane").replaceChildren();
  document.getElementById("detail-pane").replaceChildren();
  tab.render();
}

function buildRail() {
  const list = document.getElementById("tab-list");
  for (const tab of TABS) {
    list.append(
      el("button", {
        class: "tab-btn", type: "button",
        dataset: { tab: tab.id },
        onclick: () => selectTab(tab.id),
      }, tab.label)
    );
  }
}

// --- daemon status poll --------------------------------------------------
function setDaemon(dotClass, label) {
  document.getElementById("daemon-dot").className = `daemon-dot ${dotClass}`;
  document.getElementById("daemon-label").textContent = label;
}

async function pollDaemon() {
  try {
    const s = await api("/daemon/status");
    if (s.status === "running") {
      if (s.stale) setDaemon("warn", "stale");
      else setDaemon("up", "running");
    } else if (s.status === "halted" || s.status === "stopping") {
      setDaemon("down", s.status);
    } else if (s.stale) {
      setDaemon("warn", "stale");
    } else if (s.status === "not running") {
      setDaemon("faint", "not running");
    } else {
      setDaemon("faint", s.status || "unknown");
    }
  } catch (_) {
    // A down daemon is a normal state, not a dismissible error.
    setDaemon("down", "unreachable");
  }
}

// --- boot ----------------------------------------------------------------
document.addEventListener("DOMContentLoaded", () => {
  buildRail();
  selectTab("catalog");
  pollDaemon();
  setInterval(pollDaemon, 10000);
});
</script>
</body>
</html>
